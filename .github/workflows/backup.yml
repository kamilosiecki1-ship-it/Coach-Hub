name: Daily DB Backup

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Dump and encrypt database
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          OUT_DIR: backup
        run: .github/scripts/db-backup.sh

      - name: Upload backup artifact
        uses: actions/upload-artifact@v6
        with:
          name: db-backup-${{ github.run_number }}-${{ github.run_attempt }}
          path: backup/*.dump.gpg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # GitHub disables scheduled workflows after 60 days without commits, and this
  # repo is dormant. Re-enabling through the API resets that timer.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backup.yml/enable"
